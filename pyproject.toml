[project]
name = "framstay-ai-video"
version = "0.1.0"
description = "AI drone-style preview videos for villas and farm stays"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "pyyaml>=6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
